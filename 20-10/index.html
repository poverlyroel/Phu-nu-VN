<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20/10</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
    <script src="wishes.js"></script>

    <style>
      @property --accent {
        syntax: "<color>";
        inherits: true;
        initial-value: #ff3366;
      }
      @property --accent-soft {
        syntax: "<color>";
        inherits: true;
        initial-value: #ff758f;
      }

      :root {
        --accent: #ff3366;
        --accent-soft: #ff758f;
        --accent-rgb: 255, 51, 102;
        --accent-soft-rgb: 255, 117, 143;
      }

      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-weight: 100;
        touch-action: none;
        overflow: hidden;
      }

      /* Watermark góc trên bên trái */
      .watermark-roel {
        position: fixed;
        top: 18px;
        left: 22px;
        z-index: 1000000;
        color: #ffffff;
        font-family: "Be Vietnam Pro", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-shadow: 0 0 6px #ffffff, 0 0 14px rgba(255, 255, 255, 0.9),
          0 0 22px rgba(255, 51, 102, 0.9);
        pointer-events: none;
        user-select: none;
      }

      #threejs-canvas {
        position: fixed;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        background: transparent;
      }
      #threejs-canvas::before,
      #threejs-canvas::after {
        content: "";
        position: absolute;
        pointer-events: none;
        z-index: 0;
        border: 1px solid rgba(var(--accent-soft-rgb), 0.18);
        border-radius: 50%;
        box-shadow: 0 0 28px rgba(var(--accent-rgb), 0.15),
          inset 0 0 28px rgba(var(--accent-soft-rgb), 0.08);
        transition: border-color 0.7s ease, box-shadow 0.7s ease;
      }
      #threejs-canvas::before {
        width: 94vw;
        height: 48vh;
        left: -34vw;
        top: 12vh;
        transform: rotate(-24deg);
      }
      #threejs-canvas::after {
        width: 112vw;
        height: 56vh;
        right: -58vw;
        bottom: 3vh;
        transform: rotate(18deg);
        border-color: rgba(var(--accent-rgb), 0.15);
      }
      #threejs-canvas > canvas {
        position: relative;
        z-index: 1;
        display: block;
        will-change: filter;
      }
      #aurora-layer {
        position: fixed;
        inset: -18%;
        z-index: 1;
        pointer-events: none;
        opacity: 0.48;
        filter: blur(42px);
        transform: translate3d(0, 0, 0);
        transition: opacity 0.8s ease;
        animation: auroraDrift 18s ease-in-out infinite alternate;
      }
      #aurora-layer::before,
      #aurora-layer::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 24% 34%,
            rgba(var(--accent-rgb), 0.52),
            transparent 36%
          ),
          radial-gradient(
            ellipse at 78% 68%,
            rgba(var(--accent-soft-rgb), 0.42),
            transparent 40%
          );
      }
      #aurora-layer::after {
        transform: rotate(28deg) scale(1.12);
        opacity: 0.65;
      }
      @keyframes auroraDrift {
        0% {
          transform: translate3d(-2%, -1%, 0) scale(1);
        }
        100% {
          transform: translate3d(2%, 1%, 0) scale(1.08);
        }
      }

      #cursor-dot,
      #cursor-ring {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000001;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-100px, -100px, 0);
      }
      #cursor-dot {
        width: 7px;
        height: 7px;
        margin: -3.5px 0 0 -3.5px;
        border-radius: 50%;
        background: var(--accent-soft);
        box-shadow: 0 0 14px 4px rgba(var(--accent-rgb), 0.85);
        transition: opacity 0.2s ease, background 0.4s ease;
      }
      #cursor-ring {
        width: 27px;
        height: 27px;
        margin: -13.5px 0 0 -13.5px;
        border: 1px solid rgba(var(--accent-soft-rgb), 0.85);
        border-radius: 50%;
        transition: opacity 0.2s ease, transform 0.18s ease,
          border-color 0.4s ease;
      }
      #cursor-ring.is-clicking {
        scale: 0.64;
      }
      .cursor-spark {
        position: fixed;
        z-index: 1000000;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        pointer-events: none;
        background: var(--accent);
        box-shadow: 0 0 10px 3px rgba(var(--accent-rgb), 0.75);
        animation: cursorSpark 0.65s ease-out forwards;
      }
      @keyframes cursorSpark {
        to {
          opacity: 0;
          transform: translate(var(--spark-dx), var(--spark-dy)) scale(0.15);
        }
      }
      @media (hover: hover) and (pointer: fine) {
        body,
        button,
        a,
        textarea {
          cursor: none;
        }
        #cursor-dot.visible,
        #cursor-ring.visible {
          opacity: 1;
        }
      }

      #tab-warp {
        position: fixed;
        inset: -12%;
        z-index: 999998;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.62) rotate(-3deg);
        background: radial-gradient(
          ellipse at center,
          rgba(var(--accent-soft-rgb), 0.38) 0%,
          rgba(var(--accent-rgb), 0.18) 24%,
          transparent 65%
        );
      }

      @media (max-width: 700px) {
        body {
          touch-action: auto;
        }

        .watermark-roel {
          top: 14px;
          left: 14px;
          font-size: 11px;
        }

        #threejs-canvas {
          touch-action: none;
        }

        #threejs-canvas::before {
          width: 150vw;
          height: 42vh;
          left: -72vw;
          top: 18vh;
        }

        #threejs-canvas::after {
          width: 170vw;
          height: 48vh;
          right: -102vw;
          bottom: 8vh;
        }

        #aurora-layer {
          opacity: 0.35;
          filter: blur(28px);
        }

        #tab-warp {
          inset: -24%;
        }
      }
    </style>
  </head>
  <body>
    <!-- Dòng chữ góc trên bên trái -->
    <div class="watermark-roel">MADE W ❤️ BY ROEL</div>

    <div id="aurora-layer" aria-hidden="true"></div>
    <div id="cursor-dot" aria-hidden="true"></div>
    <div id="cursor-ring" aria-hidden="true"></div>
    <div id="tab-warp" aria-hidden="true"></div>

    <script>
      window.currentWishTab = "chung";

      function hexToRgb(hex) {
        const value = String(hex || "").replace("#", "");
        const normalized = value.length === 3
          ? value.split("").map((char) => char + char).join("")
          : value;
        const parsed = Number.parseInt(normalized, 16);
        if (!Number.isFinite(parsed)) return [255, 51, 102];
        return [(parsed >> 16) & 255, (parsed >> 8) & 255, parsed & 255];
      }

      function getWishTheme(tabId) {
        return (
          (window.WISH_TABS || []).find((tab) => tab.id === tabId) ||
          (window.WISH_TABS || [])[0] || {
            color: "#ff3366",
            colorSoft: "#ff758f",
            sealEmoji: "❤️",
            petalEmojis: ["🌹", "🌸", "✨", "❤️"],
          }
        );
      }

      function applyWishTheme(tabId) {
        const theme = getWishTheme(tabId);
        const accentRgb = hexToRgb(theme.color);
        const accentSoftRgb = hexToRgb(theme.colorSoft);
        const petalEmojis = Array.isArray(theme.petalEmojis) && theme.petalEmojis.length
          ? theme.petalEmojis.slice()
          : ["🌹", "🌸", "✨", "❤️"];
        const root = document.documentElement;

        root.style.setProperty("--accent", theme.color);
        root.style.setProperty("--accent-soft", theme.colorSoft);
        root.style.setProperty("--accent-rgb", accentRgb.join(", "));
        root.style.setProperty("--accent-soft-rgb", accentSoftRgb.join(", "));

        window.currentWishTheme = theme;
        window.currentAccentRGB = accentRgb;
        window.currentPetalEmojis = petalEmojis;
      }

      window.applyWishTheme = applyWishTheme;
      applyWishTheme(window.currentWishTab);
    </script>

    <script>
      (function () {
        const dot = document.getElementById("cursor-dot");
        const ring = document.getElementById("cursor-ring");
        let lastSparkAt = 0;

        function moveCursor(event) {
          if (event.pointerType === "touch") return;
          const x = event.clientX;
          const y = event.clientY;
          dot.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          ring.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          dot.classList.add("visible");
          ring.classList.add("visible");

          const now = performance.now();
          if (now - lastSparkAt < 65) return;
          lastSparkAt = now;
          const spark = document.createElement("div");
          spark.className = "cursor-spark";
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;
          spark.style.setProperty("--spark-dx", `${(Math.random() - 0.5) * 18}px`);
          spark.style.setProperty("--spark-dy", `${(Math.random() - 0.5) * 18}px`);
          document.body.appendChild(spark);
          setTimeout(() => spark.remove(), 700);
        }

        document.addEventListener("pointermove", moveCursor);
        document.addEventListener("pointerdown", (event) => {
          if (event.pointerType !== "touch") ring.classList.add("is-clicking");
        });
        document.addEventListener("pointerup", () => {
          ring.classList.remove("is-clicking");
        });
        window.addEventListener("blur", () => {
          dot.classList.remove("visible");
          ring.classList.remove("visible");
        });
      })();
    </script>

    <div id="threejs-canvas"></div>

    <style>
      #toggle-music {
        position: fixed;
        top: 16px;
        right: 16px;
        background: none;
        border: 2px solid #fff;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        padding: 6px;
        transition: transform 0.2s ease;
        z-index: 999999;
      }
      #toggle-music.playing #icon-note,
      #toggle-music.playing #icon-note-slash {
        animation: spin 3s linear infinite;
      }
      #toggle-music svg {
        display: block;
      }
      .playing #icon-note {
        display: block !important;
      }

      .playing #icon-note-slash {
        display: none !important;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <button id="toggle-music">
      <svg id="icon-note" width="24" height="24" style="display: none">
        <path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z" />
      </svg>
      <svg id="icon-note-slash" width="24" height="24">
        <path
          fill="currentColor"
          d="M10 3v10.55A4 4 0 1 0 12 15.55V5h4V3h-6z"
        />
        <line
          x1="3"
          y1="3"
          x2="21"
          y2="21"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </button>

    <audio id="bg-audio" src="nanahoshi.mp3" loop autoplay preload="auto"></audio>

    <script>
      let isPlaying = false;
      const btn = document.getElementById("toggle-music");
      const audioEl = document.getElementById("bg-audio");
      window.addEventListener("load", () => {
        audioEl
          .play()
          .then(() => {
            isPlaying = true;
            btn.classList.add("playing");
          })
          .catch(() => {});
      });
      function playMedia() {
        audioEl.play();
      }
      function pauseMedia() {
        audioEl.pause();
      }

      btn.addEventListener("click", () => {
        if (!isPlaying) playMedia();
        else pauseMedia();
        isPlaying = !isPlaying;
        btn.classList.toggle("playing", isPlaying);
      });
    </script>

    <script src="script.js"></script>
  </body>
</html>
